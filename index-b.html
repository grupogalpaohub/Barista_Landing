<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Latte Express Boot Camp — Versão B</title>
    <meta name="description" content="Variante B: HERO dinâmico com imersão visual e conversão alta." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles-b.css" />
  </head>
  <body class="b">
    <header class="site-header" role="banner">
      <div class="container header-inner">
        <a href="#topo" class="brand" aria-label="Ir para o topo">
          <img src="/Logo_academy.png" alt="Latte Art Academy by Ronnie." width="50" height="50" loading="eager" />
        </a>
        <a href="#checkout" class="btn btn-primary cta-sticky">Reservar em Grupo</a>
      </div>
    </header>

    <main id="conteudo">
      <section id="topo" class="hero-b" aria-label="Hero versão B">
        <div class="kenburns" aria-hidden="true"></div>
        <div class="steam" aria-hidden="true"></div>
        <div class="container hero-b-inner">
          <img src="/Logo_academy.png" alt="Latte Art Academy by Ronnie." class="hero-logo" width="240" height="240" loading="eager" />
          <h1>Boot Camp PRESENCIAL (EM GRUPO, ATÉ 4 VAGAS)</h1>
          <p class="sub">Em 1 dia (6h): espresso 1:2 (25–30s) + seu primeiro coração limpo.</p>
          <div class="marquee" aria-label="Detalhes">
            <div class="track">
              <span>Presencial</span>
              <span>Em grupo (4 pessoas)</span>
              <span>Dublin</span>
              <span>01/11 às 10:00 (6h)</span>
            </div>
          </div>
          <div class="cta-row">
            <a href="#checkout-solo" class="btn btn-primary">Reservar Solo</a>
            <a href="#checkout" class="btn btn-primary">Reservar em Grupo</a>
          </div>
          <div class="timer" aria-label="Janela de extração">25–30s</div>
        </div>
      </section>

      <section class="restante">
        <div class="container">
          <p>[Resto da página igual à versão A — reutilize se desejar]</p>
        </div>
      </section>
    </main>

    <script src="/script-b.js" defer></script>
  </body>
  </html>
